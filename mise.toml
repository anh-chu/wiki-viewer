[tools]
node = "22"

# Release is driven by CI: pushing a `vX.Y.Z` tag triggers .github/workflows/publish.yml
# which runs `npm publish`. NEVER `git push --tags` — it pushes every stale local tag,
# each of which triggers its own publish job, and the last one to finish repoints npm
# `latest`. This task bumps the version and pushes ONLY the single new tag.
[tasks.release]
description = "Bump version and release via CI (usage: mise run release [patch|minor|major])"
run = """
set -euo pipefail
level="${1:-patch}"
case "$level" in patch|minor|major) ;; *) echo "usage: mise run release [patch|minor|major]" >&2; exit 1 ;; esac

# Must be on main with a clean tree, in sync with origin.
branch="$(git rev-parse --abbrev-ref HEAD)"
[ "$branch" = "main" ] || { echo "refusing: on '$branch', not main" >&2; exit 1; }
git diff --quiet && git diff --cached --quiet || { echo "refusing: working tree dirty" >&2; exit 1; }
git fetch origin main --tags --quiet
[ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "refusing: local main not in sync with origin/main" >&2; exit 1; }

# Gate on the same checks CI runs, so a bad build never gets tagged.
pnpm typecheck
pnpm test

# Bump (creates the version commit + vX.Y.Z tag), then push main and ONLY that tag.
new_tag="$(npm version "$level" -m 'version: %s')"
echo "created $new_tag"
git push origin main
git push origin "refs/tags/$new_tag"
echo "pushed $new_tag — CI will publish; verify with: npm view wiki-viewer dist-tags.latest"
"""
